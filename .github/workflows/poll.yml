name: Poll EV charger status

on:
  # No `schedule:` trigger here on purpose — GitHub's own cron scheduler is
  # unreliable in practice (observed running hours apart instead of every
  # 5 minutes). Instead, a Cloudflare Worker (trigger-worker/, deployed
  # separately via wrangler) calls this workflow's dispatch API every
  # minute on a precise Cloudflare Cron Trigger. This `workflow_dispatch`
  # is what it calls, and also what the "Run workflow" button uses for
  # manual testing.
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a one-off test push instead of polling (verifies the ntfy path)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: read

concurrency:
  group: ev-charger-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Poll charger status
        env:
          COGNITO_REFRESH_TOKEN: ${{ secrets.COGNITO_REFRESH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_NOTIFY: ${{ github.event.inputs.test_notify == 'true' && '1' || '' }}
        run: node poll.js

      - name: Commit state if changed
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update charger state"
            git push
          fi

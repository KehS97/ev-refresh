name: Poll EV charger status

on:
  schedule:
    # GitHub's practical minimum interval for scheduled workflows is ~5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a one-off test push instead of polling (verifies the ntfy path)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ev-charger-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Poll charger status
        env:
          COGNITO_REFRESH_TOKEN: ${{ secrets.COGNITO_REFRESH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFY: ${{ github.event.inputs.test_notify == 'true' && '1' || '' }}
        run: node poll.js

      - name: Commit state if changed
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update charger state"
            git push
          fi
